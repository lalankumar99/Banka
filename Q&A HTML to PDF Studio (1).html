<!DOCTYPE html>
<html lang="en">
<head>

    <title>Q&A HTML to PDF Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Font Selector -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- html2pdf.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* Curated Font Families */
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-roboto { font-family: 'Roboto', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .font-merriweather { font-family: 'Merriweather', serif; }
        .font-lora { font-family: 'Lora', serif; }
        .font-baskerville { font-family: 'Libre Baskerville', serif; }
        .font-crimson { font-family: 'Crimson Pro', serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }

        /* Screen Preview A4 Sheet Container */
        #pdf-document {
            background-color: #ffffff !important;
            color: #000000 !important;
            box-sizing: border-box;
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 12mm 14mm;
            overflow-x: hidden;
        }

        /* When capturing for html2pdf, remove internal padding so html2pdf margins don't double up or clip right edge */
        #pdf-document.pdf-capture-mode {
            width: 710px !important;
            max-width: 710px !important;
            min-height: auto !important;
            padding: 2px 4px !important;
            margin: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Safe Pure-White Mode: Keeps background white & text black WITHOUT destroying SVGs, Diagrams, or <hr> lines */
        .pure-white-mode,
        .pure-white-mode div:not(.preserve-diagram *),
        .pure-white-mode section,
        .pure-white-mode article,
        .pure-white-mode main,
        .pure-white-mode header,
        .pure-white-mode footer,
        .pure-white-mode p,
        .pure-white-mode ul,
        .pure-white-mode ol,
        .pure-white-mode li,
        .pure-white-mode dl,
        .pure-white-mode dt,
        .pure-white-mode dd,
        .pure-white-mode table,
        .pure-white-mode thead,
        .pure-white-mode tbody,
        .pure-white-mode tfoot,
        .pure-white-mode tr,
        .pure-white-mode th,
        .pure-white-mode td,
        .pure-white-mode pre,
        .pure-white-mode code,
        .pure-white-mode blockquote,
        .pure-white-mode figure,
        .pure-white-mode figcaption,
        .pure-white-mode h1,
        .pure-white-mode h2,
        .pure-white-mode h3,
        .pure-white-mode h4,
        .pure-white-mode h5,
        .pure-white-mode h6,
        .pure-white-mode span {
            background-color: #ffffff !important;
            background-image: none !important;
            color: #000000 !important;
            box-shadow: none !important;
            text-shadow: none !important;
        }

        /* Ensure <hr> is always a clean visible line */
        .html-answer-content hr {
            border: 0 !important;
            border-top: 1.5px solid #222222 !important;
            height: 0 !important;
            margin: 14px 0 !important;
            background: transparent !important;
        }

        /* Clean Typography & Spacing inside HTML Answers */
        .html-answer-content {
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 100%;
            box-sizing: border-box;
        }
        .html-answer-content * {
            box-sizing: border-box;
            max-width: 100%;
        }
        .html-answer-content p {
            margin-top: 0;
            margin-bottom: 0.6em;
        }
        .html-answer-content ul {
            list-style-type: disc;
            padding-left: 1.4rem;
            margin-top: 0.25em;
            margin-bottom: 0.7em;
        }
        .html-answer-content ol {
            list-style-type: decimal;
            padding-left: 1.4rem;
            margin-top: 0.25em;
            margin-bottom: 0.7em;
        }
        .html-answer-content li {
            margin-bottom: 0.3em;
        }
        .html-answer-content table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 0.75em 0 !important;
            table-layout: auto;
        }
        .html-answer-content th,
        .html-answer-content td {
            border: 1px solid #000000 !important;
            padding: 7px 10px !important;
            vertical-align: middle;
        }
        .html-answer-content th {
            font-weight: 700;
            border-bottom: 1.5px solid #000000 !important;
        }
        .html-answer-content pre,
        .html-answer-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
        }
        .html-answer-content pre {
            border: 1px solid #000000 !important;
            padding: 10px 12px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0.7em 0;
        }
        .html-answer-content blockquote {
            border-left: 3px solid #000000 !important;
            padding-left: 12px;
            margin: 0.7em 0;
        }
        .html-answer-content h1, 
        .html-answer-content h2, 
        .html-answer-content h3, 
        .html-answer-content h4 {
            font-weight: 700;
            margin-top: 0.85em;
            margin-bottom: 0.35em;
            page-break-after: avoid !important;
            break-after: avoid !important;
        }
        .html-answer-content img,
        .html-answer-content svg {
            max-width: 100% !important;
            height: auto !important;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Question Block: MUST ALLOW breaking inside so Q1 starts right on Page 1! */
        .qa-block {
            page-break-inside: auto !important;
            break-inside: auto !important;
            margin-bottom: 1.4rem;
            padding-bottom: 1rem;
            border-bottom: 1.5px solid #d1d5db;
        }
        .qa-block:last-child {
            border-bottom: none;
        }

        /* Keep Question Title glued to the start of its answer */
        .qa-question-header {
            page-break-after: avoid !important;
            break-after: avoid !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        /* Keep atomic blocks from getting sliced in half across page breaks */
        .atomic-keep-together,
        .html-answer-content tr,
        .html-answer-content li,
        .html-answer-content pre,
        .html-answer-content blockquote,
        .html-answer-content figure,
        .html-answer-content svg,
        .html-answer-content img {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        .force-page-break {
            page-break-after: always !important;
            break-after: page !important;
        }

        /* Visual Page Break Guide on Screen Preview */
        .page-break-badge {
            border-top: 2px dashed #9ca3af;
            text-align: center;
            margin: 16px 0;
            position: relative;
        }

        /* Native Print Engine Rules (Zero Cut-off Vector PDF) */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm 12mm 12mm 12mm;
            }
            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
            .no-print {
                display: none !important;
            }
            main {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
            }
            #preview-wrapper {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                background: #ffffff !important;
                overflow: visible !important;
                width: 100% !important;
            }
            #pdf-document {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                padding: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
                min-height: auto !important;
            }
            .screen-only-indicator {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-inter">

    <!-- Top Control Bar (Hidden in Print) -->
    <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            
            <!-- Brand Title -->
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-file-pdf"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">Q&A HTML to PDF Studio <span class="text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold ml-1">v2.0 Fixed</span></h1>
                    <p class="text-xs text-slate-500">No Blank Page 1 • Preserves Styles & Diagrams • Smart Page-Break Guard</p>
                </div>
            </div>

            <!-- Typography & Layout Controls -->
            <div class="flex flex-wrap items-center gap-2.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                
                <!-- Font Selector -->
                <div class="flex items-center gap-1.5 px-2">
                    <label for="fontSelector" class="text-xs font-semibold text-slate-600 whitespace-nowrap">
                        <i class="fa-solid fa-font mr-1"></i>Font:
                    </label>
                    <select id="fontSelector" onchange="updateDocumentTypography()" class="bg-white border border-slate-300 text-slate-800 text-xs font-medium rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="font-poppins">Poppins (Modern Clean)</option>
                        <option value="font-inter" selected>Inter (Crisp Sans)</option>
                        <option value="font-merriweather">Merriweather (Book Serif)</option>
                        <option value="font-lora">Lora (Exam / Academic Serif)</option>
                        <option value="font-roboto">Roboto (Standard Sans)</option>
                        <option value="font-baskerville">Libre Baskerville (Classic Print)</option>
                        <option value="font-crimson">Crimson Pro (Editorial)</option>
                        <option value="font-mono-code">JetBrains Mono (Technical)</option>
                    </select>
                </div>

                <!-- Font Size Selector -->
                <div class="flex items-center gap-1.5 px-2 border-l border-slate-200">
                    <label for="fontSizeSelector" class="text-xs font-semibold text-slate-600 whitespace-nowrap">Size:</label>
                    <select id="fontSizeSelector" onchange="updateDocumentTypography()" class="bg-white border border-slate-300 text-slate-800 text-xs font-medium rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="12px">12px (Compact)</option>
                        <option value="13px">13px (Standard)</option>
                        <option value="14px" selected>14px (Readable)</option>
                        <option value="15px">15px (Medium)</option>
                        <option value="16px">16px (Large)</option>
                    </select>
                </div>

                <!-- Pure White Enforcer Toggle -->
                <label class="flex items-center gap-1.5 px-2.5 py-1 border-l border-slate-200 cursor-pointer select-none" title="Keeps paper pure white & black while keeping SVG diagrams and layouts intact">
                    <input type="checkbox" id="pureWhiteToggle" checked onchange="updateDocumentTypography()" class="rounded text-slate-900 focus:ring-slate-900 w-3.5 h-3.5">
                    <span class="text-xs font-semibold text-slate-700">Pure White Paper</span>
                </label>

                <!-- Prevent Cut-Off Smart Guard -->
                <label class="flex items-center gap-1.5 px-2.5 py-1 border-l border-slate-200 cursor-pointer select-none" title="Prevents headings, formulas, diagrams, and table rows from getting cut in half">
                    <input type="checkbox" id="keepTogetherToggle" checked onchange="renderPreview()" class="rounded text-slate-900 focus:ring-slate-900 w-3.5 h-3.5">
                    <span class="text-xs font-semibold text-slate-700">Smart Anti-Cutoff</span>
                </label>
            </div>

            <!-- Export PDF Actions -->
            <div class="flex items-center gap-2">
                <button onclick="printVectorPDF()" class="px-3.5 py-2 rounded-lg border-2 border-slate-900 bg-white hover:bg-slate-100 text-slate-900 text-xs font-bold flex items-center gap-1.5 shadow-sm transition" title="Best Quality: Uses native vector PDF engine (Select 'Save as PDF' in print dialog)">
                    <i class="fa-solid fa-print"></i>
                    <span>Sharp Vector PDF (Print)</span>
                </button>
                <button id="downloadPdfBtn" onclick="downloadDirectPDF()" class="px-4 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-download"></i>
                    <span>Direct Download PDF</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Split Workspace -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 md:p-6">
        
        <!-- LEFT PANEL: Question & Raw HTML Input Editor (5 cols on large screens) -->
        <section class="no-print lg:col-span-5 flex flex-col gap-4">
            
            <!-- Document Header Card -->
            <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-heading"></i> Document Header (Starts directly with Q1 on Page 1)
                    </h2>
                    <label class="flex items-center gap-1.5 text-xs text-slate-600 cursor-pointer">
                        <input type="checkbox" id="showHeaderToggle" checked onchange="renderPreview()" class="rounded text-slate-900">
                        <span>Show Header</span>
                    </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <input type="text" id="docTitleInput" value="Assignment" oninput="renderPreview()" placeholder="Document Title (e.g., Assignment)" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
                    <input type="text" id="docSubtitleInput" value="Subject: Electrical Power Generation And Transmission" oninput="renderPreview()" placeholder="Subtitle / Subject" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
            </div>

            <!-- Action Bar for Questions -->
            <div class="flex flex-wrap items-center justify-between gap-2 bg-white rounded-xl border border-slate-200 p-3 shadow-sm">
                <div class="flex items-center gap-2">

                <i class="fa-solid fa-circle-plus"></i> Add Another Question & HTML Answer

        </section>

<div class="tp-section-heading">3. Main Parts and Their Working</div>
<div class="tp-parts-grid">
    <div class="tp-part-item">
        <strong>1. Coal Handling System</strong>
        Receives, stores and transports coal to the boiler after crushing it into smaller pieces.
    </div>
    <div class="tp-part-item">
        <strong>2. Pulverizer</strong>
        Converts crushed coal into fine powder so it mixes easily with air and burns efficiently.
    </div>
    <div class="tp-part-item">
        <strong>3. Boiler</strong>
        Closed vessel in which water is heated by burning coal to produce high-pressure steam.
    </div>
    <div class="tp-part-item">
        <strong>4. Superheater</strong>
        Increases the temperature of saturated steam into superheated steam for higher efficiency.
    </div>
    <div class="tp-part-item">
        <strong>5. Steam Turbine</strong>
        Converts high-pressure steam energy into mechanical shaft rotation through expansion.
    </div>
    <div class="tp-part-item">
        <strong>6. Alternator (Generator)</strong>
        Coupled to the turbine shaft; converts mechanical energy into 3-phase electrical energy.
    </div>
    <div class="tp-part-item">
        <strong>7. Condenser</strong>
        Condenses exhaust steam from the turbine back into water for recirculation.
    </div>
    <div class="tp-part-item">
        <strong>8. Feed Water Pump</strong>
        Increases pressure of condensed water and supplies it back to the boiler via economiser.
    </div>
    <div class="tp-part-item">
        <strong>9. Economiser</strong>
        Uses waste heat from flue gases to preheat feed water before entering the boiler.
    </div>
    <div class="tp-part-item">
        <strong>10. Air Preheater &amp; ESP</strong>
        Preheats combustion air and removes fly ash/dust particles before releasing gas via Chimney.
    </div>
</div>

<div class="tp-section-heading">4. Working Principle</div>
<ol>
    <li>Coal is crushed and converted into fine powder by the pulverizer.</li>
    <li>Powdered coal is mixed with pre-heated air and burnt in the boiler furnace.</li>
    <li>Heat converts boiler water into high-pressure steam, which is further heated by the superheater.</li>
    <li>Superheated steam expands inside the steam turbine and rotates its shaft.</li>
    <li>The turbine drives the coupled alternator to generate electrical power.</li>
    <li>Exhaust steam enters the condenser, cools into water, and is pumped back by the feed water pump.</li>
</ol>

<div class="tp-section-heading">6. Important Formulae</div>
<div class="formula-card atomic-keep-together">
    <div><strong>1. Single-Phase Electrical Power:</strong></div>
    <div class="formula-math">P = V &times; I &times; cos &phi;</div>

    <div><strong>2. Three-Phase Electrical Power:</strong></div>
    <div class="formula-math">P = &radic;3 &times; V<sub>L</sub> &times; I<sub>L</sub> &times; cos &phi;</div>

    <div><strong>3. Thermal Efficiency:</strong></div>
    <div class="formula-math">&eta;<sub>thermal</sub> = (W<sub>net</sub> / Q<sub>in</sub>) &times; 100%</div>

    <div><strong>4. Mechanical Efficiency:</strong></div>
    <div class="formula-math">&eta;<sub>m</sub> = (P<sub>shaft</sub> / P<sub>turbine</sub>) &times; 100%</div>

    <div><strong>5. Overall Efficiency:</strong></div>
    <div class="formula-math" style="border-bottom: none; margin-bottom: 4px;">&eta;<sub>overall</sub> = (P<sub>electrical</sub> / Q<sub>fuel</sub>) &times; 100%</div>

    <p style="font-size: 0.9em; margin-top: 6px; margin-bottom: 0;">
        <strong>Where:</strong> P = Electrical Power (W), V = Voltage (V), I = Current (A), cos &phi; = Power Factor, &eta; = Efficiency, W<sub>net</sub> = Net Work Output, Q<sub>in</sub> = Heat Supplied.
    </p>
</div>

        /**
         * Smart HTML & Style Extractor:
         * 1. Preserves <style> blocks from full HTML documents pasted by the user!
         * 2. Scopes `body` CSS rules to `.html-answer-content` so layout, centering, and borders work properly.
         * 3. Strips unwanted colors from non-diagram elements if Pure White Mode is enabled, WITHOUT breaking SVGs or diagrams.
         */
        function parseAndCleanQuestionHTML(rawHtml, stripInlineColors, scopeId) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml || '', 'text/html');

            // Remove dangerous executable tags
            doc.querySelectorAll('script, iframe, object, embed').forEach(el => el.remove());

            // Extract any <style> tags from <head> or <body> so user's custom classes/tables/centering aren't lost!
            let extractedCSS = '';
            doc.querySelectorAll('style').forEach(styleEl => {
                let cssText = styleEl.textContent || '';
                // Replace `body` or `html` selectors with our scoped answer container
                cssText = cssText.replace(/\b(html|body)\b/gi, `#${scopeId}`);
                extractedCSS += `\n/* Scoped CSS for ${scopeId} */\n` + cssText;
                styleEl.remove();
            });

            // Clean inline background/text colors on regular text/table elements while leaving <svg> and diagrams intact
            if (stripInlineColors) {
                doc.body.querySelectorAll('*').forEach(el => {
                    const tag = el.tagName.toLowerCase();
                    // Never strip attributes inside <svg> elements
                    if (tag === 'svg' || el.closest('svg')) return;

                    el.removeAttribute('bgcolor');
                    el.removeAttribute('color');
                    if (el.hasAttribute('style')) {
                        el.style.backgroundColor = '';
                        el.style.backgroundImage = '';
                        el.style.color = '';
                        el.style.boxShadow = '';
                        if (!el.getAttribute('style').trim()) {
                            el.removeAttribute('style');
                        }
                    }
                });
            }

            // Ensure external images have crossOrigin set so html2canvas doesn't taint or skip them
            doc.body.querySelectorAll('img').forEach(img => {
                img.setAttribute('crossorigin', 'anonymous');
            });

            return {
                cleanBodyHTML: doc.body.innerHTML,
                extractedCSS: extractedCSS
            };
        }

            const styleBucket = document.getElementById('extracted-user-styles');
            const showHeader = document.getElementById('showHeaderToggle').checked;
            const docTitle = document.getElementById('docTitleInput').value.trim();
            const docSubtitle = document.getElementById('docSubtitleInput').value.trim();
            const pureWhite = document.getElementById('pureWhiteToggle').checked;

            document.getElementById('questionCountBadge').textContent = `${questionsData.length} Question${questionsData.length === 1 ? '' : 's'}`;

            let htmlParts = [];
            let allExtractedCSS = '';

            // Compact Document Header (Glued to Q1 so Page 1 is NEVER blank!)
            if (showHeader && (docTitle || docSubtitle)) {
                htmlParts.push(`
                    <header class="border-b-2 border-black pb-2.5 mb-4" style="page-break-after: avoid; break-after: avoid;">
                        ${docTitle ? `<h1 class="text-xl font-bold tracking-tight text-black leading-snug">${escapeAttr(docTitle)}</h1>` : ''}
                        ${docSubtitle ? `<p class="text-xs font-semibold text-black mt-0.5">${escapeAttr(docSubtitle)}</p>` : ''}
                    </header>
                `);
            }

            // Render each Question & Raw HTML Answer (Flows naturally from Page 1!)
            questionsData.forEach((item, idx) => {
                const scopeId = `qa_scope_${idx}`;
                const parsed = parseAndCleanQuestionHTML(item.htmlContent, pureWhite, scopeId);
                allExtractedCSS += parsed.extractedCSS;

                const pageBreakClass = item.pageBreakAfter ? 'force-page-break' : '';

                htmlParts.push(`
                    <section id="${scopeId}" class="qa-block ${pageBreakClass}">
                        <div class="qa-question-header flex items-baseline gap-2 mb-2.5">
                            <span class="font-bold text-black shrink-0 text-[1.05em]">${escapeAttr(item.qNumber || `Q${idx + 1}.`)}</span>
                            <h2 class="font-bold text-black leading-snug text-[1.05em]">${escapeAttr(item.questionText || 'Untitled Question')}</h2>
                        </div>
                        <div class="html-answer-content text-black">
                            ${parsed.cleanBodyHTML}
                        </div>
                    </section>
                `);

                if (item.pageBreakAfter) {
                    htmlParts.push(`
                        <div class="screen-only-indicator page-break-badge no-print">
                            <span class="bg-white px-2 text-[10px] font-mono uppercase tracking-wider text-slate-400">--- Manual Page Break ---</span>
                        </div>
                    `);
                }
            });

            styleBucket.textContent = allExtractedCSS;
            pdfDoc.innerHTML = htmlParts.join('');
            applySmartHeadingAndBlockProtection(pdfDoc);
        }

        // Method 1: Native Vector Print-to-PDF (100% Razor-Sharp Vector Text, Zero Blank Page, Perfect SVG/Formulas)
        function printVectorPDF() {
            window.print();
        }

        // Method 2: Fixed Direct Download PDF via html2pdf.js
        async function downloadDirectPDF() {
            const pdfDoc = document.getElementById('pdf-document');
            const downloadBtn = document.getElementById('downloadPdfBtn');
            const keepTogether = document.getElementById('keepTogetherToggle').checked;
            const docTitle = (document.getElementById('docTitleInput').value.trim() || 'QA_Document')
                .replace(/[^a-zA-Z0-9_-]/g, '_');

            // Hide screen-only page-break indicators
            const indicators = pdfDoc.querySelectorAll('.screen-only-indicator');
            indicators.forEach(el => el.style.display = 'none');

            // Enter exact printable width capture mode so right borders never clip and margins don't double up
            pdfDoc.classList.add('pdf-capture-mode');

            // Smart height check: Only put page-break-inside: avoid on blocks that fit within ~65% of an A4 page (< 620px)
            // This guarantees a large multi-page question NEVER gets pushed off Page 1!
            const smartAvoidList = ['tr', 'li', 'pre', 'blockquote', '.qa-question-header', '.tp-part-item', 'h1', 'h2', 'h3', 'h4'];
            pdfDoc.querySelectorAll('table, .formula-card, .tp-diagram-box, figure, svg').forEach(el => {
                if (el.offsetHeight < 650) {
                    el.classList.add('pdf-safe-atomic');
                } else {
                    el.classList.remove('pdf-safe-atomic');
                    el.style.pageBreakInside = 'auto';
                    el.style.breakInside = 'auto';
                }
            });
            if (keepTogether) {
                smartAvoidList.push('.pdf-safe-atomic');
            }

            // Explicit pixel dimensions on inline SVGs so html2canvas renders every line & text cleanly
            const svgs = pdfDoc.querySelectorAll('svg');
            const svgBackups = [];
            svgs.forEach(svg => {
                const rect = svg.getBoundingClientRect();
                svgBackups.push({
                    el: svg,
                    w: svg.getAttribute('width'),
                    h: svg.getAttribute('height')
                });
                if (rect.width > 0 && rect.height > 0) {
                    svg.setAttribute('width', Math.round(rect.width));
                    svg.setAttribute('height', Math.round(rect.height));
                }
            });

            downloadBtn.disabled = true;
            showToast('Generating fixed PDF (Starting right on Page 1)...', true);

            const opt = {
                margin: [10, 10, 10, 10], // top, left, bottom, right in mm
                filename: `${docTitle}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    letterRendering: true,
                    scrollY: 0,
                    windowWidth: 780
                },
                jsPDF: {
                    unit: 'mm',
                    format: 'a4',
                    orientation: 'portrait'
                },
                pagebreak: {
                    mode: ['css', 'legacy'],
                    before: '.force-page-break',
                    avoid: smartAvoidList
                }
            };

            try {
                await html2pdf().set(opt).from(pdfDoc).save();
                showToast('PDF downloaded! Check Page 1, Diagram & Formulae.');
            } catch (err) {
                console.error('PDF generation error:', err);
                showToast('Error in direct download. Use "Sharp Vector PDF (Print)" button.');
            } finally {
                // Restore UI preview state
                svgBackups.forEach(item => {
                    if (item.w) item.el.setAttribute('width', item.w);
                    else item.el.removeAttribute('width');
                    if (item.h) item.el.setAttribute('height', item.h);
                    else item.el.removeAttribute('height');
                });
                pdfDoc.classList.remove('pdf-capture-mode');
                indicators.forEach(el => el.style.display = '');
                downloadBtn.disabled = false;
            }
        }

        // Initialize on load
        window.onload = function () {
            renderEditorCards();
            updateDocumentTypography();
        };
    </script>
