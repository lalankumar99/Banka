<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#030510">
    <title>Download | GP BANKA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background-color: #030510;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Same Ambient Background from your theme */
        .ambient-glow { position: fixed; border-radius: 50%; filter: blur(140px); z-index: -2; pointer-events: none; }
        .glow-top-left { width: 400px; height: 400px; background: rgba(59, 130, 246, 0.2); top: -150px; left: -150px; }
        .glow-bottom-right { width: 450px; height: 450px; background: rgba(139, 92, 246, 0.15); bottom: -200px; right: -150px; }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -3; pointer-events: none;
        }

        /* Center Content Box */
        .content-box {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
            max-width: 90%;
        }

        .icon { font-size: 60px; margin-bottom: 20px; line-height: 1; }
        
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #93c5fd, #d8b4fe);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }

        .btn-home {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #ffffff;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Backgrounds -->
    <div class="bg-grid"></div>
    <div class="ambient-glow glow-top-left"></div>
    <div class="ambient-glow glow-bottom-right"></div>

    <!-- Main Message -->
    <div class="content-box">
        <div class="icon">🚧</div>
        <h1>Not Available</h1>
        <p>This section is currently under development.</p>
        <a href="index.html" class="btn-home">← Back to Home</a>
    </div>

</body>
</html>
