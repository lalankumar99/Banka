<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Study Hub - GP Banka</title>

  <!-- Core Stylesheets (Pure White Android UI) -->
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>

  <!-- =========================================================
       TOP APP BAR (Back Button + Dynamic Branch/Category Title)
       ========================================================= -->
  <header class="app-header">
    <div class="brand-area">
      <button type="button" class="back-btn" onclick="history.length > 1 ? history.back() : location.href='../index.html'" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="brand-info">
        <span class="brand-title" id="studyHeading">Study Material</span>
        <span class="brand-subtitle" id="studySubheading">All Branches • All Semesters</span>
      </div>
    </div>
  </header>

  <!-- =========================================================
       MAIN SCROLLABLE STUDY HUB
       ========================================================= -->
  <main class="app-main">

    <!-- 1. Instant Search Bar (Subjects, Topics, Videos, Quizzes) -->
    <div class="search-box">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="search"
        id="materialSearch"
        placeholder="सब्जेक्ट, यूनिट, वीडियो या क्विज़ खोजें..."
        autocomplete="off"
      />
    </div>

    <!-- 2. Category Filter Chips (Notes, VVI, PYQ, Syllabus, Videos, Quiz) -->
    <div class="filter-label">Category</div>
    <div class="chip-row" id="typeFilterChips">
      <button type="button" class="filter-chip active" data-type="all">All</button>
      <button type="button" class="filter-chip" data-type="notes">Notes</button>
      <button type="button" class="filter-chip" data-type="vvi">VVI Questions</button>
      <button type="button" class="filter-chip" data-type="pyq">PYQs</button>
      <button type="button" class="filter-chip" data-type="syllabus">Syllabus</button>
      <button type="button" class="filter-chip" data-type="videos">Videos</button>
      <button type="button" class="filter-chip" data-type="quiz">MCQ Quiz</button>
    </div>

    <!-- 3. File Format Filter (Videos और MCQ Quiz मोड में ऑटो-हाइड) -->
    <div id="fileFormatSection">
      <div class="filter-label">File Type</div>
      <div class="chip-row" id="formatFilterChips">
        <button type="button" class="filter-chip active" data-format="all">All Files</button>
        <button type="button" class="filter-chip" data-format="pdf">PDF</button>
        <button type="button" class="filter-chip" data-format="image">Image</button>
        <button type="button" class="filter-chip" data-format="doc">DOC</button>
        <button type="button" class="filter-chip" data-format="html">HTML</button>
      </div>
    </div>

    <!-- 4. Result Header & Counter -->
    <div class="section-header">
      <h2 class="section-title">Available Content</h2>
      <span class="notice-date" id="materialCount">Loading...</span>
    </div>

    <!-- 5. Dynamic Container (Materials / Video Player / MCQ Quiz) -->
    <div class="list-stack" id="materialList">
      <div class="empty-state">स्टडी मटेरियल लोड हो रहा है...</div>
    </div>

  </main>

  <!-- =========================================================
       FIXED BOTTOM NAVIGATION BAR
       ========================================================= -->
  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </a>

    <a href="branches.html" class="nav-item active">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Branches</span>
    </a>

    <a href="teachers.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      </svg>
      <span>Teachers</span>
    </a>

    <a href="tools.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Tools</span>
    </a>
  </nav>

  <!-- =========================================================
       CORE DATA & FEATURE MODULES (Load Order Matters)
       ========================================================= -->
  <script src="../js/core/firebase-config.js" defer></script>
  <script src="../js/core/data-service.js" defer></script>
  <script src="../js/modules/videos.js" defer></script>
  <script src="../js/modules/quiz.js" defer></script>
  <script src="../js/modules/study.js" defer></script>

</body>
</html>
