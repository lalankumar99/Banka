<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>File Viewer - GP Banka</title>

  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>

  <!-- ========== TOP APP BAR ========== -->
  <header class="app-header">
    <div class="brand-area">
      <button type="button" class="back-btn" onclick="history.length > 1 ? history.back() : location.href='study-material.html'" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="brand-info">
        <span class="brand-title" id="viewerTitle">Loading File...</span>
        <span class="brand-subtitle" id="viewerSubtitle">GP Banka Viewer</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- Bookmark / Save Button -->
      <button type="button" id="bookmarkBtn" class="icon-btn hidden" aria-label="Save Note">
        <svg id="bookmarkIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

      <!-- Share Button -->
      <button type="button" id="shareBtn" class="icon-btn hidden" aria-label="Share File">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

      <!-- Direct Download Button -->
      <a href="#" id="downloadBtn" class="icon-btn hidden" download aria-label="Download File">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </a>
    </div>
  </header>

  <!-- ========== MAIN VIEWER AREA ========== -->
  <main class="viewer-main">
    <div class="viewer-meta-bar" id="viewerMetaBar">
      <span id="viewerSubject">Preparing...</span>
      <span class="badge-clean" id="viewerFormatBadge">FILE</span>
    </div>

    <div class="viewer-stage" id="viewerStage">
      <div class="viewer-fallback-box">
        <div class="help-desc">फाइल लोड हो रही है...</div>
      </div>
    </div>
  </main>

  <!-- Core + Viewer Module -->
  <script src="../js/core/firebase-config.js" defer></script>
  <script src="../js/core/data-service.js" defer></script>
  <script src="../js/modules/file-viewer.js" defer></script>
</body>
</html>
