<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Student Tools - GP Banka</title>

  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>

  <!-- ========== TOP APP BAR ========== -->
  <header class="app-header">
    <div class="brand-area">
      <a href="../index.html" class="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="brand-info">
        <span class="brand-title">Student Tools</span>
        <span class="brand-subtitle">SBTE Calculators & Utilities</span>
      </div>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="app-main">

    <!-- Tool 1: SBTE SGPA to Percentage -->
    <section class="app-section">
      <div class="section-header">
        <h2 class="section-title">SGPA / CGPA to Percentage</h2>
      </div>

      <div class="app-card">
        <div class="input-group">
          <label class="input-label" for="sgpaInput">Enter SGPA / CGPA (Out of 10)</label>
          <input type="number" id="sgpaInput" class="app-input" placeholder="उदाहरण: 8.21" step="0.01" min="0" max="10" />
        </div>
        <button type="button" class="btn-solid" id="calcSgpaBtn" style="width:100%;">Calculate Percentage</button>

        <div class="result-box hidden" id="sgpaResultBox">
          <div>
            <div class="help-title">Estimated Percentage</div>
            <div class="notice-date">Formula: (SGPA - 0.75) × 10</div>
          </div>
          <div class="result-value" id="sgpaResultVal">0%</div>
        </div>
      </div>
    </section>

    <!-- Tool 2: Total Marks Percentage -->
    <section class="app-section">
      <div class="section-header">
        <h2 class="section-title">Semester Marks Percentage</h2>
      </div>

      <div class="app-card">
        <div class="grid-2">
          <div class="input-group">
            <label class="input-label" for="obtMarks">Obtained Marks</label>
            <input type="number" id="obtMarks" class="app-input" placeholder="744" min="0" />
          </div>
          <div class="input-group">
            <label class="input-label" for="totMarks">Total Marks</label>
            <input type="number" id="totMarks" class="app-input" value="1000" min="1" />
          </div>
        </div>
        <button type="button" class="btn-outline" id="calcMarksBtn" style="width:100%; padding:10px;">Calculate Marks %</button>

        <div class="result-box hidden" id="marksResultBox">
          <div class="help-title">Total Percentage</div>
          <div class="result-value" id="marksResultVal">0%</div>
        </div>
      </div>
    </section>

  </main>

  <!-- ========== FIXED BOTTOM NAVIGATION ========== -->
  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </a>
    <a href="branches.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Branches</span>
    </a>
    <a href="teachers.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      </svg>
      <span>Teachers</span>
    </a>
    <a href="tools.html" class="nav-item active">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Tools</span>
    </a>
  </nav>

  <script>
    // 1. SGPA to Percentage
    document.getElementById("calcSgpaBtn").addEventListener("click", () => {
      const val = parseFloat(document.getElementById("sgpaInput").value);
      if (isNaN(val) || val < 0 || val > 10) return;
      const pct = Math.max(0, (val - 0.75) * 10).toFixed(2);
      document.getElementById("sgpaResultVal").textContent = `${pct}%`;
      document.getElementById("sgpaResultBox").classList.remove("hidden");
    });

    // 2. Marks to Percentage
    document.getElementById("calcMarksBtn").addEventListener("click", () => {
      const obt = parseFloat(document.getElementById("obtMarks").value);
      const tot = parseFloat(document.getElementById("totMarks").value);
      if (isNaN(obt) || isNaN(tot) || tot <= 0) return;
      const pct = ((obt / tot) * 100).toFixed(2);
      document.getElementById("marksResultVal").textContent = `${pct}%`;
      document.getElementById("marksResultBox").classList.remove("hidden");
    });
  </script>
</body>
</html>
