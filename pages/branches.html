<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>All Branches - GP Banka</title>

  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>

  <!-- ========== TOP APP BAR ========== -->
  <header class="app-header">
    <div class="brand-area">
      <a href="../index.html" class="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <div class="brand-info">
        <span class="brand-title">All Branches</span>
        <span class="brand-subtitle">Government Polytechnic Banka</span>
      </div>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="app-main">
    <div class="section-header">
      <h2 class="section-title">Select Your Department</h2>
      <span class="notice-date" id="branchCount">Loading...</span>
    </div>

    <div class="list-stack" id="allBranchList">
      <div class="empty-state">ब्रांच की लिस्ट लोड हो रही है...</div>
    </div>
  </main>

  <!-- ========== FIXED BOTTOM NAVIGATION ========== -->
  <nav class="bottom-nav">
    <a href="../index.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </a>

    <a href="branches.html" class="nav-item active">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Branches</span>
    </a>

    <a href="teachers.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      </svg>
      <span>Teachers</span>
    </a>

    <a href="tools.html" class="nav-item">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Tools</span>
    </a>
  </nav>

  <script src="../js/core/firebase-config.js" defer></script>
  <script src="../js/core/data-service.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const listEl = document.getElementById("allBranchList");
      const countEl = document.getElementById("branchCount");
      const branches = await window.DataService.getBranches();

      countEl.textContent = `${branches.length} Branches`;

      if (!branches.length) {
        listEl.innerHTML = `<div class="empty-state">कोई ब्रांच डेटा नहीं मिला।</div>`;
        return;
      }

      listEl.innerHTML = branches
        .map(
          (b) => `
          <a href="semester.html?branch=${encodeURIComponent(b.id)}" class="app-card branch-card">
            <div class="branch-left">
              <div class="branch-code">${b.code}</div>
              <div>
                <div class="branch-name">${b.name}</div>
                <div class="branch-meta">${b.meta || "1st - 6th Sem"}</div>
              </div>
            </div>
            <svg class="chevron-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>
        `
        )
        .join("");
    });
  </script>
</body>
</html>
